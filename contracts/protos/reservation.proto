syntax = "proto3";

option csharp_namespace = "TicketFlow.Contracts.Reservation";

package ticketflow.reservation.v1;

// Contract-first (Ch3): ordering-service (client) and reservation-service (server) both
// compile this same file — neither owns the shape, the .proto does. Phase 1 only needs a
// single sync round-trip to prove gRPC works; real seat-holding logic lands in Phase 2.
service ReservationService {
  rpc CheckSeatAvailability (CheckSeatAvailabilityRequest) returns (CheckSeatAvailabilityResponse);
  rpc GetHoldQuote (GetHoldQuoteRequest) returns (GetHoldQuoteResponse);
}

message GetHoldQuoteRequest {
  string hold_id = 1;
  string owner_user_id = 2;
}

message GetHoldQuoteResponse {
  string hold_id = 1;
  string event_id = 2;
  string owner_user_id = 3;
  repeated string seat_ids = 4;
  string amount = 5;
  string currency = 6;
  int64 price_snapshot_version = 7;
  string expires_at = 8;
  int64 generation = 9;
}

message CheckSeatAvailabilityRequest {
  string event_id = 1;
  repeated string seat_ids = 2;
}

message CheckSeatAvailabilityResponse {
  bool all_available = 1;
  repeated string unavailable_seat_ids = 2;
}
