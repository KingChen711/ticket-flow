{{- if .Values.secrets.create }}
{{- $dev := .Values.secrets.development }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
type: Opaque
stringData:
  postgres-admin-password: {{ $dev.postgresAdminPassword | quote }}
  db-catalog-password: {{ $dev.catalogDbPassword | quote }}
  db-identity-password: {{ $dev.identityDbPassword | quote }}
  db-reservation-password: {{ $dev.reservationDbPassword | quote }}
  db-ordering-password: {{ $dev.orderingDbPassword | quote }}
  db-payment-password: {{ $dev.paymentDbPassword | quote }}
  db-ticketing-password: {{ $dev.ticketingDbPassword | quote }}
  db-keycloak-password: {{ $dev.keycloakDbPassword | quote }}
  connection-catalog: {{ printf "Host=postgres;Port=5432;Database=ticketflow_catalog;Username=ticketflow_catalog;Password=%s;Maximum Pool Size=8" $dev.catalogDbPassword | quote }}
  connection-identity: {{ printf "Host=postgres;Port=5432;Database=ticketflow_identity;Username=ticketflow_identity;Password=%s;Maximum Pool Size=8" $dev.identityDbPassword | quote }}
  connection-reservation: {{ printf "Host=postgres;Port=5432;Database=ticketflow_reservation;Username=ticketflow_reservation;Password=%s;Maximum Pool Size=16" $dev.reservationDbPassword | quote }}
  connection-ordering: {{ printf "Host=postgres;Port=5432;Database=ticketflow_ordering;Username=ticketflow_ordering;Password=%s;Maximum Pool Size=16" $dev.orderingDbPassword | quote }}
  connection-payment: {{ printf "Host=postgres;Port=5432;Database=ticketflow_payment;Username=ticketflow_payment;Password=%s;Maximum Pool Size=16" $dev.paymentDbPassword | quote }}
  connection-ticketing: {{ printf "Host=postgres;Port=5432;Database=ticketflow_ticketing;Username=ticketflow_ticketing;Password=%s;Maximum Pool Size=16" $dev.ticketingDbPassword | quote }}
  postgres-uri-catalog: {{ printf "postgresql://ticketflow_catalog:%s@postgres:5432/ticketflow_catalog" $dev.catalogDbPassword | quote }}
  postgres-uri-identity: {{ printf "postgresql://ticketflow_identity:%s@postgres:5432/ticketflow_identity" $dev.identityDbPassword | quote }}
  postgres-uri-reservation: {{ printf "postgresql://ticketflow_reservation:%s@postgres:5432/ticketflow_reservation" $dev.reservationDbPassword | quote }}
  postgres-uri-ordering: {{ printf "postgresql://ticketflow_ordering:%s@postgres:5432/ticketflow_ordering" $dev.orderingDbPassword | quote }}
  postgres-uri-payment: {{ printf "postgresql://ticketflow_payment:%s@postgres:5432/ticketflow_payment" $dev.paymentDbPassword | quote }}
  postgres-uri-ticketing: {{ printf "postgresql://ticketflow_ticketing:%s@postgres:5432/ticketflow_ticketing" $dev.ticketingDbPassword | quote }}
  redis-password: {{ $dev.redisPassword | quote }}
  redis-connection: {{ printf "redis:6379,password=%s,abortConnect=false" $dev.redisPassword | quote }}
  rabbitmq-admin-password: {{ $dev.rabbitmqAdminPassword | quote }}
  rabbitmq-app-password: {{ $dev.rabbitmqAppPassword | quote }}
  kafka-username: {{ $dev.kafkaUsername | quote }}
  kafka-password: {{ $dev.kafkaPassword | quote }}
  kafka-client-properties: |
    security.protocol=PLAINTEXT
  mongo-password: {{ $dev.mongoPassword | quote }}
  mongo-connection: {{ printf "mongodb://%s:%s@mongodb:27017" .Values.infra.mongodb.user $dev.mongoPassword | quote }}
  clickhouse-password: {{ $dev.clickhousePassword | quote }}
  clickhouse-connection: {{ printf "Host=clickhouse;Port=8123;Database=%s;Username=%s;Password=%s" .Values.infra.clickhouse.db .Values.infra.clickhouse.user $dev.clickhousePassword | quote }}
  minio-access-key: {{ .Values.infra.minio.user | quote }}
  minio-secret-key: {{ $dev.minioSecretKey | quote }}
  keycloak-admin-password: {{ $dev.keycloakAdminPassword | quote }}
  keycloak-admin-client-secret: {{ $dev.identityAdminClientSecret | quote }}
  notification-api-key: {{ $dev.notificationApiKey | quote }}
  aws-access-key: {{ $dev.awsAccessKey | quote }}
  aws-secret-key: {{ $dev.awsSecretKey | quote }}
  grafana-admin-password: {{ $dev.grafanaAdminPassword | quote }}
  customer-auth-secret: {{ $dev.customerAuthSecret | quote }}
  customer-client-secret: {{ $dev.customerClientSecret | quote }}
  organizer-auth-secret: {{ $dev.organizerAuthSecret | quote }}
  organizer-client-secret: {{ $dev.organizerClientSecret | quote }}
  scanner-auth-secret: {{ $dev.scannerAuthSecret | quote }}
  scanner-client-secret: {{ $dev.scannerClientSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.rabbitDefinitionsName }}
type: Opaque
stringData:
  definitions.json: |
    {
      "users": [
        {"name": {{ .Values.infra.rabbitmq.adminUser | quote }}, "password": {{ $dev.rabbitmqAdminPassword | quote }}, "tags": "administrator"},
        {"name": {{ .Values.infra.rabbitmq.appUser | quote }}, "password": {{ $dev.rabbitmqAppPassword | quote }}, "tags": ""}
      ],
      "vhosts": [{"name": {{ .Values.runtime.rabbitmq.virtualHost | quote }}}],
      "permissions": [
        {"user": {{ .Values.infra.rabbitmq.adminUser | quote }}, "vhost": {{ .Values.runtime.rabbitmq.virtualHost | quote }}, "configure": ".*", "write": ".*", "read": ".*"},
        {"user": {{ .Values.infra.rabbitmq.appUser | quote }}, "vhost": {{ .Values.runtime.rabbitmq.virtualHost | quote }}, "configure": ".*", "write": ".*", "read": ".*"}
      ]
    }
{{- end }}
