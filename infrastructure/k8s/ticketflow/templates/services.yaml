{{- $root := . }}
{{- $saleTopic := index .Values.infra.kafka.topics 0 }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ $name }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }} }
      annotations:
        checksum/runtime-contract: {{ toJson (dict "runtime" $root.Values.runtime "secret" $root.Values.secrets.name "kafkaTopics" $root.Values.infra.kafka.topics) | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      {{- if $svc.usesKafka }}
      volumes:
        - name: kafka-client
          secret:
            secretName: {{ $root.Values.secrets.name }}
            items: [{ key: kafka-client-properties, path: client.properties }]
        {{- if $root.Values.runtime.kafka.caSecretName }}
        - name: kafka-ca
          secret: { secretName: {{ $root.Values.runtime.kafka.caSecretName }} }
        {{- end }}
      {{- end }}
      {{- if or $root.Values.infra.elasticsearch.enabled $svc.schemaGate $svc.usesKafka }}
      initContainers:
        {{- if $root.Values.infra.elasticsearch.enabled }}
        - name: wait-for-log-policy
          image: {{ $root.Values.monitoring.curlImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ceu", "--"]
          args:
            - until curl --fail --silent --show-error {{ printf "%s/_ilm/policy/ticketflow-logs-retention" ($root.Values.runtime.elasticsearchUri | trimSuffix "/") | quote }} >/dev/null; do sleep 2; done
          resources:
{{ toYaml $root.Values.workloads.resources | indent 12 }}
        {{- end }}
        {{- if $svc.schemaGate }}
        {{- if eq $svc.schemaGate.kind "ef" }}
        - name: wait-for-schema
          image: {{ $root.Values.infra.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.secrets.name }}, key: {{ $svc.postgresUriSecretKey }} }
            - { name: SCHEMA_NAME, value: {{ $svc.schemaGate.schema | quote }} }
            - { name: EXPECTED_MIGRATION, value: {{ $svc.schemaGate.migration | quote }} }
          command: ["bash", "-ceu", "--"]
          args:
            - |
              # EF's migrations history stays in public even when domain tables use a
              # component schema. This was verified against all five real databases; querying
              # $SCHEMA_NAME here would wait forever after a successful migration. The naming
              # conventions plugin also maps MigrationId to migration_id.
              until [ "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM public.\"__EFMigrationsHistory\" WHERE migration_id = '$EXPECTED_MIGRATION'" 2>/dev/null)" = "1" ]; do
                echo "Waiting for $SCHEMA_NAME migration $EXPECTED_MIGRATION"
                sleep 2
              done
        {{- else if eq $svc.schemaGate.kind "marten" }}
        - name: wait-for-schema
          image: {{ $root.Values.infra.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.secrets.name }}, key: {{ $svc.postgresUriSecretKey }} }
          command: ["bash", "-ceu", "--"]
          args:
            - |
              until [ "$(psql "$DATABASE_URL" -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('mt_events','mt_streams')" 2>/dev/null)" = "2" ]; do
                echo "Waiting for Marten event-store schema"
                sleep 2
              done
        {{- else if eq $svc.schemaGate.kind "elasticsearch" }}
        - name: wait-for-schema
          image: {{ $root.Values.monitoring.curlImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ceu", "--"]
          args:
            - until curl --fail --silent --show-error {{ printf "%s/%s" ($root.Values.runtime.elasticsearchUri | trimSuffix "/") $svc.schemaGate.index | quote }} >/dev/null; do sleep 2; done
        {{- else if eq $svc.schemaGate.kind "clickhouse" }}
        - name: wait-for-schema
          image: {{ $root.Values.infra.clickhouse.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.secrets.name }}, key: clickhouse-password }
          command: ["bash", "-ceu", "--"]
          args:
            - |
              secure_arg=()
              {{- if $root.Values.runtime.clickhouse.secure }}
              secure_arg=(--secure)
              {{- end }}
              until [ "$(clickhouse-client --host {{ $root.Values.runtime.clickhouse.host | quote }} --port {{ $root.Values.runtime.clickhouse.port }} "${secure_arg[@]}" --user {{ $root.Values.runtime.clickhouse.user | quote }} --password "$CLICKHOUSE_PASSWORD" --database {{ $root.Values.runtime.clickhouse.database | quote }} --query 'EXISTS TABLE {{ $svc.schemaGate.table }}' 2>/dev/null)" = "1" ]; do sleep 2; done
        {{- else if eq $svc.schemaGate.kind "mongodb" }}
        - name: wait-for-schema
          image: {{ $root.Values.infra.mongodb.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.secrets.name }}, key: mongo-connection }
          command: ["bash", "-ceu", "--"]
          args:
            - until mongosh "$MONGO_URI/{{ $svc.schemaGate.database }}" --quiet --eval "quit(db.{{ $svc.schemaGate.collection }}.getIndexes().some(i => i.name === '{{ $svc.schemaGate.index }}') ? 0 : 1)"; do sleep 2; done
        {{- end }}
        {{- end }}
        {{- if $svc.usesKafka }}
        - name: wait-for-kafka-topic
          image: {{ $root.Values.infra.kafka.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["bash", "-ceu", "--"]
          args:
            - |
              topic_ready() {
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server {{ $root.Values.runtime.kafka.host | quote }} --command-config /etc/ticketflow/kafka/client.properties --topic {{ $saleTopic.name | quote }} --describe 2>/dev/null | grep -q 'PartitionCount: {{ $saleTopic.partitions }}' &&
                /opt/kafka/bin/kafka-configs.sh --bootstrap-server {{ $root.Values.runtime.kafka.host | quote }} --command-config /etc/ticketflow/kafka/client.properties --entity-type topics --entity-name {{ $saleTopic.name | quote }} --describe 2>/dev/null | grep -q 'retention.ms={{ $saleTopic.retentionMs | int64 }}'
              }
              until topic_ready; do
                echo "Waiting for provisioned {{ $saleTopic.name }} topic contract"
                sleep 2
              done
          volumeMounts:
            - { name: kafka-client, mountPath: /etc/ticketflow/kafka, readOnly: true }
            {{- if $root.Values.runtime.kafka.caSecretName }}
            - { name: kafka-ca, mountPath: /etc/ticketflow/kafka-ca, readOnly: true }
            {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "ticketflow.appImage" (dict "root" $root "image" $svc.image) | quote }}
          imagePullPolicy: IfNotPresent
          env:
{{ include "ticketflow.serviceEnv" (dict "root" $root "service" $svc "name" $name) | indent 12 }}
          ports:
            - { name: http, containerPort: {{ $svc.port }} }
            {{- range $svc.extraPorts }}
            - { name: {{ .name }}, containerPort: {{ .port }} }
            {{- end }}
          startupProbe:
            httpGet: { path: /health/live, port: {{ $svc.port }} }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /health/live, port: {{ $svc.port }} }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: {{ $svc.port }} }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 1654
          {{- if and $svc.usesKafka $root.Values.runtime.kafka.caSecretName }}
          volumeMounts:
            - { name: kafka-ca, mountPath: /etc/ticketflow/kafka-ca, readOnly: true }
          {{- end }}
          resources:
{{ toYaml $root.Values.workloads.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ $name }} }
spec:
  {{- if $svc.nodePort }}
  type: NodePort
  {{- end }}
  selector: { app: {{ $name }} }
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      {{- if $svc.nodePort }}
      nodePort: {{ $svc.nodePort }}
      {{- end }}
    {{- range $svc.extraPorts }}
    - { name: {{ .name }}, port: {{ .port }}, targetPort: {{ .port }} }
    {{- end }}
---
{{- end }}
{{- end }}
