# Generic template ranging over .Values.services — 1 shape (Deployment + Service) shared by all
# 11 .NET API services + gateway, same "1 building block, N call sites" philosophy as
# AddTicketFlowWeb/AddTicketFlowObservability in the code itself. Per-service differences (port,
# an extra gRPC port for reservation, the 2 Aws:LambdaServiceUrl overrides) live entirely in
# values.yaml — this template never changes when a 12th service is added.
#
# Real design win confirmed live: because Commit 1's K8s Service names (postgres, redis, rabbitmq,
# kafka, minio, elasticsearch, mongodb, clickhouse, keycloak) and this template's Service names
# (catalog, identity, reservation, ...) match the exact hostnames already hardcoded in each
# service's appsettings.json (the "Docker" environment file compose already uses) — almost NO env
# var overrides are needed. Only 2 real differences from compose: Aws:LambdaServiceUrl (LocalStack
# now lives OUTSIDE the cluster, mục 3/rủi ro số 2) and ASPNETCORE_ENVIRONMENT=Docker (to select
# appsettings.json over appsettings.Development.json, same env value compose already sets).
{{- $root := . }}
{{- range $name, $svc := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      {{- if $svc.bootstrapDatabase }}
      # Ordering is the sole Marten-backed service. Marten creates its schema but not the
      # database itself, so make the existing local Postgres superuser create it idempotently
      # before Kestrel and its health check begin. This removes a fresh-cluster-only readiness
      # failure without putting database provisioning logic into application code.
      initContainers:
        - name: initialize-database
          image: {{ $root.Values.infra.postgres.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: {{ $root.Values.infra.postgres.user | quote }}
            - name: PGPASSWORD
              value: {{ $root.Values.infra.postgres.password | quote }}
            - name: TARGET_DATABASE
              value: {{ $svc.bootstrapDatabase | quote }}
          command:
            - sh
            - -ec
            - |
              until pg_isready -d postgres; do
                echo "Postgres is not ready; retrying in 2 seconds..."
                sleep 2
              done
              if ! psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$TARGET_DATABASE'" | grep -q 1; then
                psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$TARGET_DATABASE\""
              fi
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "ticketflow.appImage" (dict "root" $root "image" $svc.image) | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Docker"
            # Every service gets the K8s browser issuer even though only the six services that
            # call AddTicketFlowAuth consume it.  This keeps the template generic and prevents a
            # host-issued token from working at the gateway but failing on a downstream owner.
            - name: Keycloak__ValidIssuers__2
              value: {{ $root.Values.kubernetes.keycloakBrowserIssuer | quote }}
            {{- range $svc.env }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          ports:
            - containerPort: {{ $svc.port }}
            {{- range $svc.extraPorts }}
            - containerPort: {{ .port }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  {{- if $svc.nodePort }}
  type: NodePort
  {{- end }}
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
      {{- if $svc.nodePort }}
      nodePort: {{ $svc.nodePort }}
      {{- end }}
    {{- range $svc.extraPorts }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .port }}
    {{- end }}
---
{{- end }}
