{{- if .Values.infra.minio.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: minio-data }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: {{ .Values.infra.minio.storage }} }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: {{ .Values.infra.minio.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"{{ if .Values.infra.minio.tls.enabled }}, "--certs-dir", "/certs"{{ end }}]
          env:
            - { name: MINIO_ROOT_USER, value: {{ .Values.infra.minio.user | quote }} }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.name }}, key: minio-secret-key }
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          readinessProbe:
            exec:
              command: ["mc", "ready", "local"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 9000 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
{{ toYaml .Values.infra.minio.resources | indent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            {{- if .Values.infra.minio.tls.enabled }}
            - { name: tls, mountPath: /certs/public.crt, subPath: tls.crt, readOnly: true }
            - { name: tls, mountPath: /certs/private.key, subPath: tls.key, readOnly: true }
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
        {{- if .Values.infra.minio.tls.enabled }}
        - name: tls
          secret: { secretName: {{ .Values.infra.minio.tls.secretName }} }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: minio }
spec:
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
{{- end }}
