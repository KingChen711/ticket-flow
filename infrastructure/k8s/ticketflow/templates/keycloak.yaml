{{- if .Values.infra.keycloak.enabled }}
{{- if .Values.infra.keycloak.importDevelopmentRealm }}
apiVersion: v1
kind: ConfigMap
metadata: { name: keycloak-realm }
data:
  realm-export.json: |
{{ .Files.Get "files/realm-export.json" | indent 4 }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata: { name: keycloak }
spec:
  clusterIP: None
  selector: { app: keycloak }
  ports:
    - { name: http, port: 8180, targetPort: 8180 }
    - { name: https, port: 8443, targetPort: 8443 }
    - { name: management, port: 9000, targetPort: 9000 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: keycloak }
spec:
  serviceName: keycloak
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-keycloak-database
          image: {{ .Values.infra.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
{{ include "ticketflow.restrictedContainerSecurityContext" . | indent 12 }}
          resources:
{{ toYaml .Values.workloads.resources | indent 12 }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.name }}, key: db-keycloak-password }
          command: ["sh", "-ceu", "--"]
          args:
            - until pg_isready -h postgres -U {{ .Values.infra.keycloak.databaseUser }} -d {{ .Values.infra.keycloak.database }}; do sleep 2; done
      containers:
        - name: keycloak
          image: {{ .Values.infra.keycloak.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            {{- if .Values.infra.keycloak.tls.enabled }}
            - start
            - --https-certificate-file=/opt/keycloak/conf/tls/tls.crt
            - --https-certificate-key-file=/opt/keycloak/conf/tls/tls.key
            {{- else }}
            - start-dev
            {{- end }}
            {{- if .Values.infra.keycloak.importDevelopmentRealm }}
            - --import-realm
            {{- end }}
          env:
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL_HOST, value: postgres }
            - { name: KC_DB_URL_PORT, value: "5432" }
            - { name: KC_DB_URL_DATABASE, value: {{ .Values.infra.keycloak.database | quote }} }
            - { name: KC_DB_USERNAME, value: {{ .Values.infra.keycloak.databaseUser | quote }} }
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.name }}, key: db-keycloak-password }
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: {{ .Values.infra.keycloak.adminUser | quote }} }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.name }}, key: keycloak-admin-password }
            - { name: KC_HEALTH_ENABLED, value: "true" }
            - { name: KC_HTTP_PORT, value: "8180" }
          ports:
            - { name: http, containerPort: 8180 }
            - { name: https, containerPort: 8443 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /health/started, port: 9000 }
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: 9000 }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 9000 }
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.infra.keycloak.resources | indent 12 }}
          volumeMounts:
            {{- if .Values.infra.keycloak.importDevelopmentRealm }}
            - { name: realm-import, mountPath: /opt/keycloak/data/import, readOnly: true }
            {{- end }}
            {{- if .Values.infra.keycloak.tls.enabled }}
            - { name: tls, mountPath: /opt/keycloak/conf/tls, readOnly: true }
            {{- end }}
      volumes:
        {{- if .Values.infra.keycloak.importDevelopmentRealm }}
        - name: realm-import
          configMap: { name: keycloak-realm }
        {{- end }}
        {{- if .Values.infra.keycloak.tls.enabled }}
        - name: tls
          secret: { secretName: {{ .Values.infra.keycloak.tls.secretName }} }
        {{- end }}
{{- end }}
