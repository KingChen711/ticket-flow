# Jaeger + Prometheus + Grafana + Kibana — same provisioning-as-code files as
# docker-compose.monitoring.yml (Phase 10), copied into this chart's files/ (self-containment,
# same reasoning as keycloak.yaml's realm-export.json comment). Service name "ticketflow-jaeger"
# is deliberate — matches the Otlp:Endpoint value already baked into every service's
# appsettings.json, so zero env override is needed for tracing to work in the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
            - containerPort: 4317
            - containerPort: 4318
---
apiVersion: v1
kind: Service
metadata:
  # Matches every service's Otlp:Endpoint appsettings value verbatim — see comment above.
  name: ticketflow-jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
{{ .Files.Get "files/prometheus.yml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasource.yml: |
{{ .Files.Get "files/grafana-datasource.yml" | indent 4 }}
  dashboards-provider.yml: |
{{ .Files.Get "files/grafana-dashboards-provider.yml" | indent 4 }}
  dashboard.json: |
{{ .Files.Get "files/grafana-dashboard.json" | indent 4 }}
  alert-rules.yml: |
{{ .Files.Get "files/grafana-alert-rules.yml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "ticketflow"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards-provider.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/files/ticketflow-overview.json
              subPath: dashboard.json
            - name: provisioning
              mountPath: /etc/grafana/provisioning/alerting/rules.yml
              subPath: alert-rules.yml
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:8.15.3
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTICSEARCH_HOSTS
              value: '["http://elasticsearch:9200"]'
            - name: XPACK_SECURITY_ENABLED
              value: "false"
          ports:
            - containerPort: 5601
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
spec:
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: 5601
# One-shot Job — same role as the es-ilm-init compose container in Phase 10, re-run every
# `helm upgrade`/`helm install`. It MUST be a post hook: a pre-install/pre-upgrade hook runs
# before the chart's normal Elasticsearch Deployment (and its ConfigMaps) exists, which makes a
# fresh `helm install` wait forever. The policy is embedded from the chart file instead of mounted
# through a normal ConfigMap for the same ordering reason. `--wait` means Helm starts this only
# after Elasticsearch is ready; the retry loop also makes plain non-wait installs robust.
apiVersion: batch/v1
kind: Job
metadata:
  name: es-ilm-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: es-ilm-init
          image: curlimages/curl:8.11.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              cat > /tmp/ilm-policy.json <<'EOF'
{{ .Files.Get "files/ilm-policy.json" | indent 14 }}
              EOF
              until curl -sf -X PUT http://elasticsearch:9200/_ilm/policy/ticketflow-logs-retention \
                -H "Content-Type: application/json" --data-binary @/tmp/ilm-policy.json; do
                echo "Elasticsearch not ready for ILM policy; retrying in 5 seconds..."
                sleep 5
              done
