{{- if .Values.monitoring.enabled }}
# Jaeger + Prometheus + Grafana + Kibana — same provisioning-as-code files as
# docker-compose.monitoring.yml (Phase 10), copied into this chart's files/ (self-containment,
# same reasoning as keycloak.yaml's realm-export.json comment). Service name "ticketflow-jaeger"
# is deliberate — matches the Otlp:Endpoint value already baked into every service's
# appsettings.json, so zero env override is needed for tracing to work in the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: {{ .Values.monitoring.jaegerImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
            - containerPort: 4317
            - containerPort: 4318
          resources:
{{ toYaml .Values.monitoring.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  # Matches every service's Otlp:Endpoint appsettings value verbatim — see comment above.
  name: ticketflow-jaeger
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
{{ .Files.Get "files/prometheus.yml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheusImage | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
          resources:
{{ toYaml .Values.monitoring.resources | indent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
data:
  datasource.yml: |
{{ .Files.Get "files/grafana-datasource.yml" | indent 4 }}
  dashboards-provider.yml: |
{{ .Files.Get "files/grafana-dashboards-provider.yml" | indent 4 }}
  dashboard.json: |
{{ .Files.Get "files/grafana-dashboard.json" | indent 4 }}
  alert-rules.yml: |
{{ .Files.Get "files/grafana-alert-rules.yml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafanaImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secrets.name }}, key: grafana-admin-password }
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
{{ toYaml .Values.monitoring.resources | indent 12 }}
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/prometheus.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards-provider.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/files/ticketflow-overview.json
              subPath: dashboard.json
            - name: provisioning
              mountPath: /etc/grafana/provisioning/alerting/rules.yml
              subPath: alert-rules.yml
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
        - name: kibana
          image: {{ .Values.monitoring.kibanaImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: ELASTICSEARCH_HOSTS
              value: '["http://elasticsearch:9200"]'
            - name: XPACK_SECURITY_ENABLED
              value: "false"
          ports:
            - containerPort: 5601
          readinessProbe:
            httpGet:
              path: /api/status
              port: 5601
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
          resources:
{{ toYaml .Values.monitoring.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
spec:
  selector:
    app: kibana
  ports:
    - port: 5601
      targetPort: 5601
{{- end }}
{{- if .Values.infra.elasticsearch.enabled }}
{{- $policyHash := (printf "%s|%s|%s" (.Files.Get "files/ilm-policy.json") .Values.runtime.elasticsearchUri .Values.monitoring.curlImage | sha256sum | trunc 10) }}
---
# One-shot Job — same role as the es-ilm-init compose container in Phase 10, re-run every
# `helm upgrade`/`helm install`. It is deliberately a normal Job, not a post-install hook: with
# `--wait`, post-install hooks run only after application readiness, while the applications need
# this ILM policy before their Elasticsearch logging sink can bootstrap. Application init
# containers gate on the policy, so this Job is the single schema writer without a Helm deadlock.
apiVersion: batch/v1
kind: Job
metadata:
  name: es-ilm-init-{{ $policyHash }}
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: es-ilm-init
          image: {{ .Values.monitoring.curlImage | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              cat > /tmp/ilm-policy.json <<'EOF'
{{ .Files.Get "files/ilm-policy.json" | indent 14 }}
              EOF
              until curl -sf -X PUT {{ printf "%s/_ilm/policy/ticketflow-logs-retention" (.Values.runtime.elasticsearchUri | trimSuffix "/") | quote }} \
                -H "Content-Type: application/json" --data-binary @/tmp/ilm-policy.json; do
                echo "Elasticsearch not ready for ILM policy; retrying in 5 seconds..."
                sleep 5
              done
          resources:
{{ toYaml .Values.monitoring.resources | indent 12 }}
{{- end }}
