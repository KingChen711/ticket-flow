apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.infra.clickhouse.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: {{ .Values.infra.clickhouse.image }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_USER
              value: {{ .Values.infra.clickhouse.user | quote }}
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.infra.clickhouse.password | quote }}
            - name: CLICKHOUSE_DB
              value: {{ .Values.infra.clickhouse.db | quote }}
          ports:
            - containerPort: 8123
            - containerPort: 9000
          readinessProbe:
            exec:
              command: ["wget", "--no-verbose", "--tries=1", "-O-", "http://localhost:8123/ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: clickhouse-data
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000
