# Three standalone Next.js zones.  The Dockerfiles build their browser-visible values into the
# standalone output; this template supplies only server-side runtime values.  In particular,
# GATEWAY_URL is cluster-internal while the customer browser's SignalR URL is baked as
# localhost:30080 (the kind mapping declared in kind-config.yaml).
{{- $root := . }}
{{- range $name, $frontend := .Values.frontends }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-auth
type: Opaque
stringData:
  AUTH_SECRET: {{ $frontend.authSecret | quote }}
  AUTH_KEYCLOAK_ID: {{ $frontend.keycloakClientId | quote }}
  AUTH_KEYCLOAK_SECRET: {{ $frontend.keycloakClientSecret | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ include "ticketflow.appImage" (dict "root" $root "image" $frontend.image) | quote }}
          imagePullPolicy: IfNotPresent
          env:
            # Next standalone defaults to port 3000 and a loopback bind.  Explicit values make
            # organizer-dashboard (:3001) and gate-scanner (:3002) reachable through Services.
            - name: PORT
              value: {{ $frontend.port | quote }}
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: AUTH_URL
              value: "http://localhost:{{ $frontend.port }}"
            - name: AUTH_TRUST_HOST
              value: "true"
            # The pod talks to the Keycloak port-forward through Docker Desktop's host gateway;
            # a browser can resolve this hostname too (probed on this Windows host).  The OAuth
            # callback still returns to localhost:<port>, which is already registered in the
            # imported realm and matches the port-forward URL a user opens.
            - name: AUTH_KEYCLOAK_ISSUER
              value: {{ $root.Values.kubernetes.keycloakBrowserIssuer | quote }}
            - name: GATEWAY_URL
              value: "http://gateway:8080"
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-auth
                  key: AUTH_SECRET
            - name: AUTH_KEYCLOAK_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-auth
                  key: AUTH_KEYCLOAK_ID
            - name: AUTH_KEYCLOAK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}-auth
                  key: AUTH_KEYCLOAK_SECRET
          ports:
            - containerPort: {{ $frontend.port }}
          readinessProbe:
            httpGet:
              path: {{ $frontend.readinessPath | default "/" | quote }}
              port: {{ $frontend.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: {{ $frontend.port }}
      targetPort: {{ $frontend.port }}
---
{{- end }}
