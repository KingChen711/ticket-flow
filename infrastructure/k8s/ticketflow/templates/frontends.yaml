{{- $root := . }}
{{- range $name, $frontend := .Values.frontends }}
{{- if $frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ $name }} }
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ $name }} }
  template:
    metadata:
      labels: { app: {{ $name }} }
      annotations:
        checksum/auth-contract: {{ toJson (dict "secret" $root.Values.secrets.name "issuer" $root.Values.runtime.keycloak.browserIssuer) | sha256sum }}
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: {{ $name }}
          image: {{ include "ticketflow.appImage" (dict "root" $root "image" $frontend.image) | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: PORT, value: {{ $frontend.port | quote }} }
            - { name: HOSTNAME, value: 0.0.0.0 }
            - { name: AUTH_URL, value: {{ $frontend.authUrl | quote }} }
            - { name: AUTH_TRUST_HOST, value: "true" }
            - { name: AUTH_KEYCLOAK_ISSUER, value: {{ $root.Values.runtime.keycloak.browserIssuer | quote }} }
            - { name: GATEWAY_URL, value: {{ $root.Values.runtime.gatewayUrl | quote }} }
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.secrets.name }}, key: {{ $frontend.authSecretKey }} }
            - { name: AUTH_KEYCLOAK_ID, value: {{ $frontend.clientId | quote }} }
            - name: AUTH_KEYCLOAK_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.secrets.name }}, key: {{ $frontend.clientSecretKey }} }
          ports:
            - { name: http, containerPort: {{ $frontend.port }} }
          readinessProbe:
            httpGet: { path: {{ $frontend.readinessPath | default "/" | quote }}, port: {{ $frontend.port }} }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: {{ $frontend.readinessPath | default "/" | quote }}, port: {{ $frontend.port }} }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            runAsNonRoot: true
            runAsUser: 1000
          resources:
{{ toYaml $root.Values.workloads.frontendResources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ $name }} }
spec:
  selector: { app: {{ $name }} }
  ports:
    - { name: http, port: {{ $frontend.port }}, targetPort: {{ $frontend.port }} }
---
{{- end }}
{{- end }}
