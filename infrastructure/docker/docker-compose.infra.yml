services:
  postgres:
    image: postgres:16
    container_name: ticketflow-postgres
    environment:
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
      POSTGRES_DB: ticketflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: ticketflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ticketflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ticketflow
      RABBITMQ_DEFAULT_PASS: ticketflow
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: ticketflow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      # No host publish for 9092 (PLAINTEXT, container-internal — other containers reach it via
      # kafka:9092 through the Docker network regardless of host port mapping) — it also happened
      # to land inside the same Windows port-exclusion range as MinIO/ClickHouse/Keycloak below,
      # and dropping it is simpler than remapping a port nothing on the host actually needs.
      # PLAINTEXT_HOST://localhost:29092 is the listener that exists specifically for host access.
      - "29092:29092"

  minio:
    image: minio/minio:latest
    container_name: ticketflow-minio
    environment:
      MINIO_ROOT_USER: ticketflow
      MINIO_ROOT_PASSWORD: ticketflow
    command: server /data --console-address ":9001"
    ports:
      # Host-side only — container ports stay 9000/9001, only where Windows exposes them changes.
      # Both (and ClickHouse/Keycloak/Elasticsearch's neighboring host ports below) landed inside
      # a Windows dynamic TCP port-exclusion range (Hyper-V/WSL2 NAT can reserve blocks like this
      # after a Docker Desktop crash+restart — confirmed via `netsh interface ipv4 show
      # excludedportrange protocol=tcp` showing 8854-9553 excluded) — `bind: An attempt was made
      # to access a socket in a way forbidden by its access permissions` is that exclusion, not a
      # real conflict. Fixing it properly needs `net stop/start winnat` as admin; remapping the
      # host port is the workaround that doesn't require elevation.
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: ticketflow-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      # 512m was enough for search-index duty alone (Phase 6). Bumped for Phase 10 Commit 4 — this
      # node now also ingests Serilog's ES sink from all 11 API/gateway processes (mục 4's "1 node
      # ES gánh 2 vai" trade-off), and the sink's own bulk-indexing buffer adds real heap pressure
      # on top of search's existing usage.
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports:
      # Host-side only, same Windows port-exclusion workaround as MinIO's port comment above —
      # container still listens on 9200 (the healthcheck curl below runs inside the container).
      - "19200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  mongodb:
    image: mongo:7
    container_name: ticketflow-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ticketflow
      MONGO_INITDB_ROOT_PASSWORD: ticketflow
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ticketflow-clickhouse
    environment:
      CLICKHOUSE_USER: ticketflow
      CLICKHOUSE_PASSWORD: ticketflow
      CLICKHOUSE_DB: analytics
    ports:
      - "8123:8123"
      # Host-side only, see MinIO's port comment above — same Windows port-exclusion workaround.
      - "19010:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: ticketflow-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8180"
    ports:
      - "8180:8180"
      # 9000 is already MinIO's host port (same conflict class as ClickHouse's native port
      # earlier) — Keycloak's management/health port maps to host 9020 instead. Host-side only,
      # same Windows port-exclusion workaround as MinIO's port comment above.
      - "19020:9000"
    volumes:
      - ../keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # This image ships without curl/wget, so probe the management health
      # endpoint via bash's /dev/tcp instead of a HTTP client binary.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30

  localstack:
    # Unified image since the March-2026 Community/Pro image merge (docs/phase-9-plan.md
    # Commit 1) — the old no-account `localstack/localstack` free image is archived; this one
    # requires LOCALSTACK_AUTH_TOKEN even on the free non-commercial Hobby plan.
    image: localstack/localstack:latest
    container_name: ticketflow-localstack
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
      SERVICES: lambda,events,logs,iam,sts,s3
      # Lambda's Docker executor spawns sibling containers via the mounted socket below; without
      # this they land on the default bridge network and can't reach rabbitmq/minio/etc. by
      # service name (needed starting Commit 3/4) — join the same network this whole stack uses.
      LAMBDA_DOCKER_NETWORK: ticketflow-network
      # Phase 11 Commit 2: keep the Compose-network DNS default for normal Phase 9 development,
      # but permit the external-LocalStack/Kubernetes fallback to route Lambda PDF rendering back
      # into kind's MinIO through a temporary host port-forward (host.docker.internal:<port>).
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      # The reminder timer is useful in the Compose stack. A K8s smoke run can override this to
      # a long cadence so its Lambda does not repeatedly try to reach a Compose-only RabbitMQ.
      EVENT_REMINDER_SCHEDULE: ${EVENT_REMINDER_SCHEDULE:-rate(1 minute)}
      DEBUG: "1"
    ports:
      - "4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - localstack-data:/var/lib/localstack
      - ../localstack/init:/etc/localstack/init/ready.d:ro
      # Lambda deployment packages (function.zip) are built on the HOST by `dotnet lambda
      # package` before `docker compose up` — there's no .NET SDK inside this container to build
      # them, unlike every other service here which builds its own image from a Dockerfile. The
      # init script below reads the already-built zip from this mount.
      - ../../src/Functions:/functions:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
  minio-data:
  es-data:
  mongo-data:
  clickhouse-data:
  localstack-data:

networks:
  default:
    name: ticketflow-network
