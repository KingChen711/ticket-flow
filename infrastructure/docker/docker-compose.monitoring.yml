services:
  jaeger:
    # All-in-one — in-memory span store (traces lost on restart), same trade-off already accepted
    # for LocalStack Community (Phase 9): fine for a local learning stack, not for production.
    # No separate OpenTelemetry Collector in front of it (docs/phase-10-plan.md mục 2) — Jaeger
    # all-in-one accepts OTLP natively, a collector hop adds zero value for a single-node local
    # backend and is the kind of gold-plating scope.md mục 12 warns against.
    image: jaegertracing/all-in-one@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:16686"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    # Pull model (docs/phase-10-plan.md mục 3) — scrapes /metrics on all 11 API/gateway targets
    # listed in prometheus.yml, no push/OTLP path for metrics (that's Jaeger's job for traces).
    image: prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Host-side only (container still listens on 9090) — same Windows dynamic TCP
      # port-exclusion workaround as MinIO/ClickHouse/Keycloak/Elasticsearch/Reservation-gRPC in
      # docker-compose.infra.yml/docker-compose.yml (see MinIO's port comment there for the full
      # story: `netsh interface ipv4 show excludedportrange protocol=tcp` showing 8854-9553
      # excluded after a Docker Desktop crash+restart).
      - "19090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    # Pinned, NOT :latest — same "no version churn surprises" discipline as every other pinned
    # image in this compose stack. Real finding while verifying this commit (docs/phase-10-plan.md
    # Commit 3): in this sandboxed environment's browser automation tool, the dashboard's canvas
    # panels never visibly render (0 <canvas> elements, no /api/ds/query browser network calls,
    # tried on both :latest/13.1.0 and this pin — same symptom on both, so it isn't a version
    # issue). Isolated the real cause via a direct authenticated `/api/ds/query` call (bypassing
    # the browser entirely): Grafana's backend correctly proxies every panel's PromQL to
    # Prometheus and gets back real per-service data for all 11 targets — the datasource wiring,
    # UTF-8 dotted metric names, and every query in ticketflow-overview.json are all confirmed
    # correct end-to-end. What's unverified is only the browser's own canvas rendering, which
    # looks like a limitation of this specific sandboxed browser tool, not a real dashboard bug.
    image: grafana/grafana:11.4.0@sha256:d8ea37798ccc41061a62ab080f2676dda6bf7815558499f901bdb0f533a456fb
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ticketflow
    volumes:
      # Dashboard JSON files live directly under provisioning/dashboards/files/ (not a separate
      # bind mount) — Docker can't create a nested mountpoint inside an already-read-only parent
      # mount, confirmed by a real failed-start attempt before fixing this.
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3300:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  es-ilm-init:
    # One-shot provisioning container — same "reproducible from a file, not click-ops" discipline
    # as Keycloak's realm-export.json / Grafana's datasource+dashboard YAML. Elasticsearch does
    # NOT validate an ILM policy's existence when a data-stream index template is PUT (confirmed
    # live: `PUT _index_template/...` with `index.lifecycle.name` pointing at a policy that
    # doesn't exist yet returns 200 acknowledged) — so this isn't strictly required for the sink
    # to bootstrap without crashing, but without it retention wouldn't attach until ILM's next
    # ~10-minute poll cycle picks up the policy after the fact. Every one of the 11 API/gateway
    # processes depends_on this completing (docker-compose.yml) so retention is live from each
    # service's very first log line, not eventually-consistent.
    image: curlimages/curl:8.11.0@sha256:83a505ba2ba62f208ed6e410c268b7b9aa48f0f7b403c8108b9773b44199dbba
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ../monitoring/elasticsearch/ilm-policy.json:/ilm-policy.json:ro
    entrypoint:
      - sh
      - -c
      - >
        curl -sf -X PUT http://elasticsearch:9200/_ilm/policy/ticketflow-logs-retention
        -H "Content-Type: application/json" --data-binary @/ilm-policy.json
    restart: "no"

  kibana:
    # Pinned to match the ES server's exact version (8.15.3, docker-compose.infra.yml) — Kibana
    # enforces a compatible-version check against the cluster it connects to at startup.
    image: docker.elastic.co/kibana/kibana:8.15.3@sha256:43dffccc4085ebca96ed8a8da30116fa3a246c9e204b028949d2a8e733544987
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      # No security/xpack auth configured cluster-side (docker-compose.infra.yml sets
      # xpack.security.enabled: "false", same as the Search service already relies on) — same
      # "no login wall for a local learning stack" trade-off as Grafana's anonymous Viewer access.
      XPACK_SECURITY_ENABLED: "false"
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  prometheus-data:
  grafana-data:
