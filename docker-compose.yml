# Phase 12 Commit 14: backend services no longer publish host ports. Every one of them used to,
# so anything on the host could reach them directly on localhost:800x and skip the gateway — the
# same bypass the plan's verify bullet calls out, and the reason "only our containers can reach
# this" was never a real boundary. They still talk to each other over the Docker network by
# service DNS, which is unchanged; only the host-side mapping is gone. The gateway keeps :8080,
# and `docker-compose.debug-ports.yml` puts the direct mappings back when you need to poke a
# single service while debugging.
include:
  - infrastructure/docker/docker-compose.infra.yml
  - infrastructure/docker/docker-compose.monitoring.yml

services:
  catalog:
    build:
      context: .
      dockerfile: src/Services/Catalog/TicketFlow.Catalog.Api/Dockerfile
    container_name: ticketflow-catalog
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      es-ilm-init:
        condition: service_completed_successfully

  identity:
    build:
      context: .
      dockerfile: src/Services/Identity/TicketFlow.Identity.Api/Dockerfile
    container_name: ticketflow-identity
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      postgres:
        condition: service_healthy
      es-ilm-init:
        condition: service_completed_successfully

  reservation:
    build:
      context: .
      dockerfile: src/Services/Reservation/TicketFlow.Reservation.Api/Dockerfile
    container_name: ticketflow-reservation
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      es-ilm-init:
        condition: service_completed_successfully

  ordering:
    build:
      context: .
      dockerfile: src/Services/Ordering/TicketFlow.Ordering.Api/Dockerfile
    container_name: ticketflow-ordering
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      reservation:
        condition: service_started
      es-ilm-init:
        condition: service_completed_successfully

  notification:
    build:
      context: .
      dockerfile: src/Services/Notification/TicketFlow.Notification.Api/Dockerfile
    container_name: ticketflow-notification
    environment:
      # Local Compose is an explicit test environment; every production-like environment is
      # required to configure the real HTTP delivery provider.
      ASPNETCORE_ENVIRONMENT: Testing
    depends_on:
      rabbitmq:
        condition: service_healthy
      es-ilm-init:
        condition: service_completed_successfully

  search:
    build:
      context: .
      dockerfile: src/Services/Search/TicketFlow.Search.Api/Dockerfile
    container_name: ticketflow-search
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      es-ilm-init:
        condition: service_completed_successfully

  payment:
    build:
      context: .
      dockerfile: src/Services/Payment/TicketFlow.Payment.Api/Dockerfile
    container_name: ticketflow-payment
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      es-ilm-init:
        condition: service_completed_successfully

  ticketing:
    build:
      context: .
      dockerfile: src/Services/Ticketing/TicketFlow.Ticketing.Api/Dockerfile
    container_name: ticketflow-ticketing
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      es-ilm-init:
        condition: service_completed_successfully

  recommendation:
    build:
      context: .
      dockerfile: src/Services/Recommendation/TicketFlow.Recommendation.Api/Dockerfile
    container_name: ticketflow-recommendation
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      es-ilm-init:
        condition: service_completed_successfully

  analytics:
    build:
      context: .
      dockerfile: src/Services/Analytics/TicketFlow.Analytics.Api/Dockerfile
    container_name: ticketflow-analytics
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    depends_on:
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      # kafka has no healthcheck (docker-compose.infra.yml) — service_started is the strongest
      # signal available; KafkaTopicSetup.EnsureCreatedAsync still races the broker being fully
      # ready to serve admin requests, same as every other Kafka dependency in this stack.
      kafka:
        condition: service_started
      es-ilm-init:
        condition: service_completed_successfully

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/TicketFlow.Gateway/Dockerfile
    container_name: ticketflow-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8080:8080"
    depends_on:
      catalog:
        condition: service_started
      identity:
        condition: service_started
      reservation:
        condition: service_started
      ordering:
        condition: service_started
      es-ilm-init:
        condition: service_completed_successfully

networks:
  default:
    name: ticketflow-network
