include:
  - infrastructure/docker/docker-compose.infra.yml
  - infrastructure/docker/docker-compose.monitoring.yml

services:
  catalog:
    build:
      context: .
      dockerfile: src/Services/Catalog/TicketFlow.Catalog.Api/Dockerfile
    container_name: ticketflow-catalog
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  identity:
    build:
      context: .
      dockerfile: src/Services/Identity/TicketFlow.Identity.Api/Dockerfile
    container_name: ticketflow-identity
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  reservation:
    build:
      context: .
      dockerfile: src/Services/Reservation/TicketFlow.Reservation.Api/Dockerfile
    container_name: ticketflow-reservation
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8003:8003"
      # Host-side only (container port stays 9003, gRPC clients inside the Docker network still
      # use reservation:9003 via service DNS — unaffected). Remapped away from a Windows dynamic
      # TCP port-exclusion range (see MinIO's port comment in docker-compose.infra.yml for the
      # full story) that was blocking the bind with "forbidden by its access permissions".
      - "19003:9003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ordering:
    build:
      context: .
      dockerfile: src/Services/Ordering/TicketFlow.Ordering.Api/Dockerfile
    container_name: ticketflow-ordering
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      reservation:
        condition: service_started

  notification:
    build:
      context: .
      dockerfile: src/Services/Notification/TicketFlow.Notification.Api/Dockerfile
    container_name: ticketflow-notification
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8005:8005"
    depends_on:
      rabbitmq:
        condition: service_healthy

  search:
    build:
      context: .
      dockerfile: src/Services/Search/TicketFlow.Search.Api/Dockerfile
    container_name: ticketflow-search
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8006:8006"
    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  payment:
    build:
      context: .
      dockerfile: src/Services/Payment/TicketFlow.Payment.Api/Dockerfile
    container_name: ticketflow-payment
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ticketing:
    build:
      context: .
      dockerfile: src/Services/Ticketing/TicketFlow.Ticketing.Api/Dockerfile
    container_name: ticketflow-ticketing
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8008:8008"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  recommendation:
    build:
      context: .
      dockerfile: src/Services/Recommendation/TicketFlow.Recommendation.Api/Dockerfile
    container_name: ticketflow-recommendation
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8009:8009"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  analytics:
    build:
      context: .
      dockerfile: src/Services/Analytics/TicketFlow.Analytics.Api/Dockerfile
    container_name: ticketflow-analytics
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8010:8010"
    depends_on:
      rabbitmq:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      # kafka has no healthcheck (docker-compose.infra.yml) — service_started is the strongest
      # signal available; KafkaTopicSetup.EnsureCreatedAsync still races the broker being fully
      # ready to serve admin requests, same as every other Kafka dependency in this stack.
      kafka:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: src/Gateway/TicketFlow.Gateway/Dockerfile
    container_name: ticketflow-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    ports:
      - "8080:8080"
    depends_on:
      - catalog
      - identity
      - reservation
      - ordering

networks:
  default:
    name: ticketflow-network
